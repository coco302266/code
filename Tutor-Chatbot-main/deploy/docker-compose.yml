name: ai-classroom

# 部署目录：Tutor-Chatbot-main/deploy/
# 前置：cp .env.docker.example .env  并填入 LLM_API_KEY / MySQL 密码
# 启动：docker compose up -d --build
#
# 图形： web(nginx:80) ──/api──▶ backend(uvicorn:8000) ──▶ 宿主机(本机)MySQL:3306
#        web 同时托管前端静态产物 out/
#        后端连的是「本机 MySQL」（host.docker.internal:3306），不再用 compose 的 mysql 容器。
#        如需退回容器内建库：docker compose --profile with-mysql up -d
#
# 局域网拓扑（一台做服务器，其余电脑只跑前端连同一后端）：
#   服务器：docker compose 起全部服务，backend 留在内网、只由 web(nginx:8080) 对外。
#   客户端：各机 `npm run dev`，把 NEXT_PUBLIC_BACKEND_URL 指到
#           http://<服务器IP>:8080/api   （统一走 nginx，后端不裸奔）
#   跨域：后端自动放行私网来源（见 ALLOWED_ORIGINS / app.py 私网正则），
#         客户端无需改 IP、服务器也无需逐个登记。

services:
  mysql:
    # 默认不再启动：后端已改为连「本机 MySQL」。
    # 需要退回容器内建库时：docker compose --profile with-mysql up -d
    profiles: ["with-mysql"]
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_classroom}
      MYSQL_USER: ${MYSQL_USER:-ai_classroom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    # 不映射宿主端口：backend 走 compose 内部网络访问 mysql。
    # 宿主若已有 MySQL 占着 3306，映射会直接启动失败；需要外部连库时再临时加
    #   - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: ai-classroom-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # 连接「宿主机（本机）MySQL」：容器经 host.docker.internal 访问宿主机 3306。
      # 连接参数来自 deploy/.env 的 LOCAL_MYSQL_*（不进版本库）。
      MYSQL_HOST: ${LOCAL_MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${LOCAL_MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-ai_classroom}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-root}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD}
      # 数据目录固定到容器内路径（对应下方卷挂载）
      KNOWLEDGE_PERSIST_DIR: /app/chroma_kb
      CLASSROOM_CHROMA_DIR: /app/chroma_classrooms
      CLASSROOM_DOCS_DIR: /app/classroom_docs
      FASTEMBED_CACHE_PATH: /app/.model_cache
      # CORS：显式放行本机前端与 nginx；局域网内其他电脑的前端来源由后端
      # 内置的私网正则自动放行（见 backend/app.py），无需逐个填客户端 IP。
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8080","http://127.0.0.1:3000"]'
    extra_hosts:
      # Linux 下需显式把 host.docker.internal 指向宿主网关；Docker Desktop 自带也兼容。
      - "host.docker.internal:host-gateway"
    volumes:
      # 模型缓存：5.8G，不进镜像（离线可用）。
      # 必须 rw：fastembed 要在缓存目录内建 .locks 做文件锁，只读会直接报错。
      - ../backend/.model_cache:/app/.model_cache
      # 向量库与课堂原件：复用宿主机现有数据，可写
      - ../backend/chroma_kb:/app/chroma_kb
      - ../backend/chroma_classrooms:/app/chroma_classrooms
      - ../backend/classroom_docs:/app/classroom_docs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # 一次性建库建表（init_db.py），跑完即退出；可重复执行
  init:
    image: ai-classroom-backend:latest
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    environment:
      MYSQL_HOST: ${LOCAL_MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${LOCAL_MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-ai_classroom}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-root}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "init_db.py"]
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: /api
    image: ai-classroom-web:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
